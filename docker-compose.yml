services:
  postgres:
    image: postgres:16-alpine
    container_name: order-service-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: order-service:latest
    container_name: order-service-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_PORT: 8082
      USER_SERVICE_URL: ${DOCKER_USER_SERVICE_URL:-http://user-service-app:8080}
      USER_SERVICE_CONNECT_TIMEOUT: ${USER_SERVICE_CONNECT_TIMEOUT:-2s}
      USER_SERVICE_READ_TIMEOUT: ${USER_SERVICE_READ_TIMEOUT:-3s}
    ports:
      - "${APP_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    name: microservices
    external: true

volumes:
  postgres-data:
